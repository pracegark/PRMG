        <style>
            .job-management {
                font-family: 'Poppins', sans-serif;
                background-color: #f9f9f9;
                color: #444;
            }
            .job-management input,
            .job-management select,
            .job-management textarea,
            .job-management button {
                font-family: inherit;
            }
            .job-management .page {
                background: #f5f5f5;
            }
            .job-board-main {
                padding: clamp(40px, 7vw, 84px) 18px;
                background: linear-gradient(rgba(8, 12, 18, .42), rgba(8, 12, 18, .58)), url("images/home-slide-01.jpg") center / cover no-repeat;
            }
            .job-management .job-board-main .container { padding: 0; }
            .header-button {
              background-color: transparent !important;
              color: white !important;
              border: none;
              cursor: pointer;
              font-size: 14px;
              padding: 0;
              margin: 0;
              font-family: inherit !important;
            }

            .job-type-select {
              height: auto;
              max-height: 200px; /* Set maximum height */
              overflow-y: auto; /* Add vertical scrollbar if needed */
              border: 1px solid #ccc; /* Optional: Add a border for clarity */
              padding: 10px; /* Optional: Add padding to the box */
              white-space: normal; /* Ensure text wraps within the box */
            }



            .header-button:hover {
                color: grey; /* Change color on hover if needed */
                text-decoration: underline; /* Add underline on hover if needed */
            }

    
            .job-management .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }
    
            .job-management h2 {
                font-size: clamp(28px, 3.5vw, 38px);
                margin-bottom: 20px;
            }
    
            .job-management #job-listing-panel {
                max-width: 1120px;
                min-height: 280px;
                margin: 48px auto;
                padding: clamp(24px, 4vw, 42px);
                color: #fff;
                text-align: center;
                background: rgba(12, 17, 24, .50);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                border: 1px solid rgba(255, 255, 255, .22);
                border-radius: 18px;
                box-shadow: 0 18px 52px rgba(0, 0, 0, .28);
            }

            .job-management .job-board-main #job-listing-panel { margin: 0 auto; }

            .job-management #job-listing-panel h2 {
                color: #fff;
                font-size: clamp(28px, 3.5vw, 38px);
            }

            .job-board-empty-state {
                max-width: 680px;
                margin: 12px auto 28px;
                color: rgba(255, 255, 255, .88);
            }

            #jobList {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
                gap: 20px;
                margin: 30px 0 18px;
                text-align: left;
            }

            .job-box {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 100%;
                padding: 25px;
                color: #292b30;
                background: rgba(255, 255, 255, .97);
                border: 1px solid rgba(255, 255, 255, .72);
                border-top: 4px solid #df2539;
                border-radius: 13px;
                box-shadow: 0 12px 28px rgba(0, 0, 0, .17);
                transition: transform .2s ease, box-shadow .2s ease;
            }

            .job-box:hover {
                transform: translateY(-3px);
                box-shadow: 0 17px 34px rgba(0, 0, 0, .22);
            }

            .job-card-type {
                align-self: flex-start;
                margin-bottom: 13px;
                padding: 5px 11px;
                color: #a7192a;
                background: #fff0f2;
                border-radius: 30px;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: .06em;
                text-transform: uppercase;
            }

            .job-box .job-title {
                margin: 0 0 14px;
                color: #222;
                font-size: 22px;
                line-height: 1.3;
                overflow-wrap: anywhere;
            }

            .job-card-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 16px;
                margin-bottom: 15px;
                color: #60636a;
                font-size: 14px;
            }

            .job-card-meta span { display: inline-flex; align-items: center; gap: 6px; }

            .job-description {
                margin: 0 0 20px;
                color: #555960;
                font-size: 15px;
                line-height: 1.65;
                overflow-wrap: anywhere;
                white-space: pre-line;
            }

            .job-description-toggle {
                display: inline-block;
                list-style: none;
                margin: -8px 0 18px;
                padding: 0;
                color: #b71f31;
                background: transparent;
                border: 0;
                font: inherit;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
            }

            .job-description-toggle::-webkit-details-marker { display: none; }

            .job-description-toggle:hover { color: #821522; text-decoration: underline; }

            .job-apply-button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 9px;
                min-height: 46px;
                margin-top: auto;
                padding: 0 20px;
                color: #fff;
                background: #df2539;
                border-radius: 7px;
                font-weight: 700;
                text-align: center;
                transition: background .18s ease, transform .18s ease;
            }

            .job-apply-button:hover,
            .job-apply-button:focus {
                color: #fff;
                background: #b91d2f;
                text-decoration: none;
                transform: translateY(-1px);
            }

            .job-board-contact {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 48px;
                margin-top: 14px;
                padding: 0 24px;
                border-radius: 40px;
                background: #fff;
                color: #252525;
                font-weight: 600;
                transition: transform .2s ease, box-shadow .2s ease;
            }

            .job-board-contact:hover,
            .job-board-contact:focus {
                color: #252525;
                text-decoration: none;
                transform: translateY(-2px);
                box-shadow: 0 8px 18px rgba(0, 0, 0, .2);
            }
    
            .job-management form {
                margin-bottom: 20px;
            }
    
            .job-management label {
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
            }
    
            .job-management input[type="text"],
            .job-management textarea,
            .job-management select {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                margin-bottom: 20px;
                box-sizing: border-box;
            }
    
            @media (max-width: 767px) {
                .job-management .container {
                    padding: 10px;
                }

                #jobList { gap: 14px; margin-top: 22px; }
                .job-box { padding: 21px; }
                .job-apply-button { width: 100%; }
            }
        </style>
