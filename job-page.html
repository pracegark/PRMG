        <style>
            .job-management {
                font-family: 'Poppins', sans-serif;
                background-color: #f9f9f9;
                color: #444;
            }
            .job-management input,
            .job-management select,
            .job-management textarea,
            .job-management button {
                font-family: inherit;
            }
            .job-management .page {
                background: #f5f5f5;
            }
            .job-board-main {
                padding: clamp(40px, 7vw, 84px) 18px;
                background: linear-gradient(rgba(8, 12, 18, .42), rgba(8, 12, 18, .58)), url("images/home-slide-01.jpg") center / cover no-repeat;
            }
            .job-management .job-board-main .container { padding: 0; }
            .header-button {
              background-color: transparent !important;
              color: white !important;
              border: none;
              cursor: pointer;
              font-size: 14px;
              padding: 0;
              margin: 0;
              font-family: inherit !important;
            }

            .job-type-select {
              height: auto;
              max-height: 200px; /* Set maximum height */
              overflow-y: auto; /* Add vertical scrollbar if needed */
              border: 1px solid #ccc; /* Optional: Add a border for clarity */
              padding: 10px; /* Optional: Add padding to the box */
              white-space: normal; /* Ensure text wraps within the box */
            }



            .header-button:hover {
                color: grey; /* Change color on hover if needed */
                text-decoration: underline; /* Add underline on hover if needed */
            }

    
            .job-management .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }
    
            .job-management h2 {
                font-size: clamp(28px, 3.5vw, 38px);
                margin-bottom: 20px;
            }
    
            .job-management #job-listing-panel {
                max-width: 820px;
                min-height: 280px;
                margin: 48px auto;
                padding: clamp(28px, 5vw, 48px);
                color: #fff;
                text-align: center;
                background: rgba(12, 17, 24, .62);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, .24);
                border-radius: 12px;
                box-shadow: 0 16px 44px rgba(0, 0, 0, .24);
            }

            .job-management .job-board-main #job-listing-panel { margin: 0 auto; }

            .job-management #job-listing-panel h2 {
                color: #fff;
                font-size: clamp(28px, 3.5vw, 38px);
            }

            .job-board-empty-state {
                max-width: 540px;
                margin: 22px auto 0;
                color: rgba(255, 255, 255, .88);
            }

            .job-board-contact {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 48px;
                margin-top: 14px;
                padding: 0 24px;
                border-radius: 40px;
                background: #fff;
                color: #252525;
                font-weight: 600;
                transition: transform .2s ease, box-shadow .2s ease;
            }

            .job-board-contact:hover,
            .job-board-contact:focus {
                color: #252525;
                text-decoration: none;
                transform: translateY(-2px);
                box-shadow: 0 8px 18px rgba(0, 0, 0, .2);
            }
    
            .job-management form {
                margin-bottom: 20px;
            }
    
            .job-management label {
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
            }
    
            .job-management input[type="text"],
            .job-management textarea,
            .job-management select {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                margin-bottom: 20px;
                box-sizing: border-box;
            }
    
            .job-management button {
                background-color: #4CAF50;
                color: white;
                padding: 15px 30px;
                border: none;
                cursor: pointer;
                font-size: 16px;
            }
    
            .job-management button:hover {
                background-color: #45a049;
            }
    
            .job-box {
                background-color: #f9f9f9;
                padding: 20px;
                margin-bottom: 20px;
                position: relative;
            }
    
            .job-number {
                position: absolute;
                top: 10px;
                left: 10px;
                font-weight: bold;
                color: #007bff;
            }
    
            .job-variable {
                margin-bottom: 10px;
            }
    
            .job-variable strong {
                color: #444;
            }
    
            .delete-btn {
                position: absolute;
                top: 10px;
                right: 10px;
                background-color: #ff3333;
                color: white;
                border: none;
                padding: 5px;
                cursor: pointer;
            }
    
            @media (max-width: 767px) {
                .job-management .container {
                    padding: 10px;
                }
            }
        </style>
