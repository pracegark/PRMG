            </a>

        <div class="rd-navbar-nav-wrap">

              <ul class="rd-navbar-dropdown">

<script>
  (() => {
    const currentPath = window.location.pathname.replace(/\/$/, "/index.html");
    const links = document.querySelectorAll(".rd-navbar-nav > li > a[href]");
    links.forEach((link) => {
      const targetPath = new URL(link.getAttribute("href"), window.location.href).pathname;
      const parent = link.closest("li");
      if (targetPath === currentPath) parent.classList.add("active");
      parent.querySelectorAll(".rd-navbar-dropdown a[href]").forEach((childLink) => {
        if (new URL(childLink.getAttribute("href"), window.location.href).pathname === currentPath) {
          parent.classList.add("active");
        }
      });
    });
  })();
</script>
