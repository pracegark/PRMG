              <div class="shell text-left">
                  <h2><span class="small">Add a New Job</span>Please fill out your personal information to sign up for new job postings.</h2>
                  <form id="job-upload-form" class="text-left">
                      <div class="range offset-top-40 offset-md-top-60">
                          <div class="cell-lg-4 cell-md-6">
                              <div class="form-group postfix-xl-right-40">
                                  <label class="form-label" for="job-name">Job Title *</label>
                                  <input class="form-control" id="job-name" type="text" name="title" required>
                              </div>
                              <div class="form-group postfix-xl-right-40">
                                  <label class="form-label" for="job-type">Job Type *</label>
                                  <input class="form-control" id="job-type" type="text" name="type" required>
                              </div>
                          </div>
                          <div class="cell-lg-4 cell-md-6 offset-top-20 offset-md-top-0">
                              <div class="form-group postfix-xl-right-40">
                                  <label class="form-label" for="job-link">Link *</label>
                                  <input class="form-control" id="job-link" type="url" name="link" required>
                              </div>
                          </div>
                          <div class="cell-lg-4 cell-md-6 offset-top-20 offset-md-top-0">
                              <div class="form-group postfix-xl-right-40">
                                  <label class="form-label" for="job-location">Location</label>
                                  <input class="form-control" id="job-location" type="text" name="location">
                              </div>
                          </div>
                          <div class="cell-lg-4 offset-top-20 offset-lg-top-0">
                              <div class="form-group postfix-xl-right-40">
                                  <label class="form-label" for="job-desc">Job Description *</label>
                                  <textarea class="form-control" id="job-desc" name="description" required></textarea>
                              </div>
                          </div>
                      </div>
                      <button class="btn btn-form btn-default" type="submit">Post Job</button>
                  </form>
              </div>
          </section>
      </div>
  </section>
